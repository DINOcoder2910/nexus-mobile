name: NexusMobile
options:
  bundleIdPrefix: app.nexus
  deploymentTarget:
    iOS: "17.0"
packages:
  NexusCore:
    path: Packages/NexusCore
schemes:
  NexusMobile:
    build:
      targets:
        NexusMobile: all
targets:
  NexusMobile:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: NexusCore
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Nexus
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        # Sync talks plain HTTP to the hub on the G14 (over Tailscale or the home network); the app is sideloaded, not on the App Store.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Nexus syncs your notes with your home hub.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # the iPhone: upright and both landscapes (not upside down, as Apple's own apps)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # the Calendar reads the device's own calendars (Google, school, iCloud) through EventKit; the event sheets may show invitees
        NSCalendarsFullAccessUsageDescription: Nexus shows your calendars beside your planned tasks, and lets you add and edit events.
        NSContactsUsageDescription: Nexus shows who is invited to an event.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexus.mobile
        # 1 = iPhone, 2 = iPad: one app for both
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
