name: NexusMobile
options:
  bundleIdPrefix: app.nexus
  deploymentTarget:
    iOS: "17.0"
packages:
  NexusCore:
    path: Packages/NexusCore
schemes:
  NexusMobile:
    build:
      targets:
        NexusMobile: all
targets:
  NexusMobile:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: NexusCore
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Nexus
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        # Sync talks plain HTTP to the hub on the G14 (over Tailscale or the home network); the app is sideloaded, not on the App Store.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Nexus syncs your notes with your home hub.
        NSCameraUsageDescription: Nexus scans pages into a new board.
        NSPhotoLibraryUsageDescription: Nexus puts a photo on a new board.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexus.mobile
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
