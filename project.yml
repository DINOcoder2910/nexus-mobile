name: NexusMobile
options:
  bundleIdPrefix: app.nexus
  deploymentTarget:
    iOS: "17.0"
packages:
  NexusCore:
    path: Packages/NexusCore
schemes:
  NexusMobile:
    build:
      targets:
        NexusMobile: all
  NexusMobileUITests:
    build:
      targets:
        NexusMobile: all
        NexusMobileUITests: [test]
    test:
      targets:
        - NexusMobileUITests
targets:
  NexusMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      # the laptop's maths and chemistry renderers (tools/render/build.mjs), kept as a folder so render.html finds its fonts
      - path: Resources/Render
        type: folder
      # the laptop's rich-text editor (tools/richtext/build.mjs): rich.html and its fonts
      - path: Resources/RichText
        type: folder
      # the laptop's study tools (tools/study-tools/copy.mjs): the VSEPR chart, Enthalpies, Molecules, until the laptop sends its own
      - path: Resources/Tools
        type: folder
      # the laptop's universities database (renderer/data/universities.json) for Applications > Research
      - path: Resources/Data/universities.json
      # the kit's type (Sources/Kit/KitFonts.swift): static cuts of Onest and Gabarito (OFL), registered at launch
      - path: Resources/Fonts
        type: folder
    dependencies:
      - package: NexusCore
      # the Live Activity (Widgets/): embedded in PlugIns; build.yml takes it out of the iPad's download
      - target: NexusLiveActivity
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Nexus
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        # the iPad can have several Nexus windows (side by side, Stage Manager); each has its own task panel, add sheet and Undo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Sync talks plain HTTP to the hub on the G14 (over Tailscale or the home network); the app is sideloaded, not on the App Store.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Nexus syncs your notes with your home hub.
        # the commit this build was made from (the cloud build sets NEXUS_BUILD): told to the hub, so the laptop can say when the iPad is behind
        NexusBuild: $(NEXUS_BUILD)
        NSCameraUsageDescription: Nexus scans pages into a new board or a practice sheet into your study folder, films a class, and snaps the board while recording.
        NSPhotoLibraryUsageDescription: Nexus puts a photo on a new board.
        NSMicrophoneUsageDescription: Nexus listens while you hold the tutor button, and records meetings and classes when you ask it to.
        NSSpeechRecognitionUsageDescription: Nexus turns what you ask the tutor, and your recordings, into words on this device.
        # a class keeps recording when the screen locks or you switch apps
        UIBackgroundModes:
          - audio
          # reminders: iOS wakes the app now and then to sync and schedule them again
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.nexus.mobile.refresh
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # the iPhone: upright and both landscapes (not upside down, as Apple's own apps)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # the Calendar reads the device's own calendars (Google, school, iCloud) through EventKit; the event sheets may show invitees
        NSCalendarsFullAccessUsageDescription: Nexus shows your calendars beside your planned tasks, and lets you add and edit events.
        NSContactsUsageDescription: Nexus shows who is invited to an event.
        # the running timer and a recording on the iPhone's Lock Screen and in the Dynamic Island (Sources/LiveActivity/)
        NSSupportsLiveActivities: true
        # the Live Activity's links back in (nexus://task/<id>, nexus://recordings)
        CFBundleURLTypes:
          - CFBundleURLName: app.nexus.mobile
            CFBundleURLSchemes: [nexus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexus.mobile
        # 1 = iPhone, 2 = iPad: one app for both
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        NEXUS_BUILD: dev
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  # The Live Activity extension: draws the activities the app starts (the running timer, a recording). Under free signing it needs
  # an App ID of its own (Sideloadly registers it), so only the iPhone's download carries it (build.yml). The shared files are listed
  # one by one: the rest of Sources is the app's.
  NexusLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/LiveActivity/NexusActivity.swift
      - Sources/LiveActivity/LiveActivityViews.swift
      - Sources/LiveActivity/LiveActivityIntents.swift
    info:
      path: Support/LiveActivity-Info.plist
      properties:
        CFBundleDisplayName: Nexus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # the Home Screen widgets read the day's card from the hub on the G14 over plain HTTP (Tailscale or the home network)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: The Nexus widget reads your day from your home hub.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexus.mobile.live
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # the intents' perform runs in the app (LiveActivityIntents.swift)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEXUS_WIDGET"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  # Drives the app in the simulator (the cloud check for freezes the unit tests can't see); not part of the iPad build.
  NexusMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: NexusMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: app.nexus.mobile.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
