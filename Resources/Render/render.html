<style>:root {
  --font-display: "Gabarito Variable", system-ui, "Segoe UI", sans-serif;
  --font-ui: "Onest Variable", system-ui, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono Variable", ui-monospace, Consolas, monospace;
  /* 3. type scale (size / line): xs 11/14 kbd and the dock count only; s 13/18 metadata; m 14/20 menus, segmented; base 15/22 UI default;
     row 16/22 row titles; hero 20/28 the hero sentence and section titles; fig 28/32 figures; title 48/48 page titles */
  --fs-xs: 11px; --fs-s: 13px; --fs-m: 14px; --fs-base: 15px; --fs-row: 16px; --fs-hero: 20px; --fs-fig: 28px; --fs-title: 48px;
  --lh-xs: 14px; --lh-s: 18px; --lh-m: 20px; --lh-base: 22px; --lh-row: 22px; --lh-hero: 28px; --lh-fig: 32px; --lh-title: 48px;
  /* 4. spacing: a 4 px base */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-14: 56px; --sp-16: 64px;
  --page-top: 32px; --page-side: 64px; --page-bottom: 120px; --page-max: 1680px; /* 2026-11-09: 1200 left wide windows with empty bands at both sides */
  --row: 56px;
  /* the permanent sidebar (design-system section 4; the shell step builds it) */
  --fs-side: 14px; --lh-side: 20px;
  --side-w: 240px; --side-top: 6px; --side-pad: 12px; --side-row: 32px; --side-group: 32px; --side-rail: 56px; --side-indent: 12px;
  /* 5. radii by role */
  --r-pill: 26px; --r-field: 20px; --r-surface: 14px; --r-control: 10px; --r-chip: 8px; --r-tip: 8px; --r-kbd: 6px; --r-round: 999px;
  /* 8. motion. --spring / --spring-d are replaced at boot by motion.js with the real linear() spring (stiffness 380, damping 32, mass 1) */
  --d-fast: 90ms; --d-base: 200ms; --d-slow: 320ms; --d-hold: 400ms;
  --ease: cubic-bezier(.2, 0, 0, 1); --ease-exit: cubic-bezier(.3, 0, 1, 1); --ease-travel: cubic-bezier(.32, .72, 0, 1);
  --spring: cubic-bezier(.2, 0, 0, 1); --spring-d: 300ms;
  --icon-w: 1.75;
  /* the Folio names, as aliases (the shell step moves each view to the primary names) */
  --font-mono: var(--font-code);
  --fs: var(--fs-base); --fs-l: var(--fs-row); --fs-h3: var(--fs-hero); --fs-h2: var(--fs-hero); --fs-h1: var(--fs-fig);
  --sp-7: var(--sp-12); --gutter: 32px;
  --r-1: 6px; --r-2: var(--r-control); --r-3: var(--r-surface);
  --rule-w: 1px; --rule-strong-w: 0px; /* Folio's 2 px ink rules under titles are banned: they draw nothing now */
  --t-fast: var(--d-fast); --t: 160ms; --t-slow: 220ms; --ease-in: var(--ease-exit);
  --row-pad: 10px; --cell-pad: 9px; --card-gap: 16px; --row-h: 34px;
  --sidebar-w: 240px; --masthead-h: 44px; --status-h: 24px; --claude-w: 380px;
  --font-size: 16px;
  --line-width: 760px;
  --page-pad: var(--page-side); /* deprecated second name for the page gutter: use --page-side (.page-root) */ --page-max-read: 1080px;
}
:root {
  --bg: #FFFFFF;
  --surface-1: #F5F5F3;   /* rests: the brief, timelines, cards, the thread, the note pane */
  --surface-2: #ECECE9;   /* lifts: hovered rows, chips, segmented tracks */
  --surface-3: #E1E1DD;   /* selected, pressed, today's column, drag ghosts */
  --text: #1C1C1A;
  --muted: #5C5C56;
  --rule: #E6E6E2;        /* the only line colour */
  --accent: #0F7A49; --accent-hover: #0C6B3F; --on-accent: #FFFFFF;
  --claude: #3B5BDB; --claude-tint: #E8EDFB;
  --danger: #B3261E; --danger-tint: #FBECEA;
  --warn: #8A5600; --warn-tint: #FBF1DF;
  --star: #AA6F00;        /* the key-date ★ (a mark, never body text): a shade of warn, 3:1 on every surface */
  --ok: var(--accent);    /* one green */
  --focus: var(--accent);
  --dock: #161616; --dock-text: #F2F2F0; --dock-muted: #A3A39D; --dock-3: #2A2A2A;
  --dock-field: #232321; --dock-accent: #5CE0A1; --dock-claude: #9FB1FF;
  --shadow-float: 0 12px 32px -8px rgba(28,28,26,.22), 0 2px 6px rgba(28,28,26,.06);
  --shadow-dock: 0 1px 2px rgba(0,0,0,.16), 0 8px 20px -6px rgba(0,0,0,.26);  /* negative spread: the blur stays under the pill */
  --ring: 0 0 0 1px var(--rule);
  --rule-tick: #B8B8B2;   /* the tick's resting ring (not text) */
  --level4: var(--bg);    /* level 4 floats: bg + shadow in light */
  --float: var(--shadow-float);
  --scrim: rgba(0,0,0,.32);
  --seg-claude: #B9C7F5;  /* the brighter travelling segment on Claude's edge */
  --ws-blue: #2769B7; --ws-amber: #9A5600; --ws-green: #007F43; --ws-rose: #A14174; --ws-violet: #6A57B3;
  --ws-olive: #6F6E00; --ws-teal: #007F88; --ws-coral: #AA442B; --ws-pink: #94468F; --ws-slate: #556B82;
  /* Applications' figures: a soft shade for how good one is against the database (good, bad, and the three strengths mixed into transparent) */
  --stat-good: #1E9E5A; --stat-bad: #D4583A; --stat-1: 6%; --stat-2: 10%; --stat-3: 15%;
  /* not in the design system's table: links in notes (the accent as text), search highlights, diff lines (code colours: codetheme.js) */
  --link: var(--accent); --info: var(--text);
  --accent-wash: #ECF4F0;  /* 8% of the accent over bg (themes.js accentVars recomputes it for another accent) */
  --highlight: var(--warn-tint); --add-bg: #E2EFE9; --del-bg: var(--danger-tint);
  --selection: color-mix(in srgb, var(--accent) 22%, transparent);
  color-scheme: light;
}
:root { --paper: var(--bg); --paper-2: var(--surface-1); --paper-3: var(--level4); --ink: var(--text);
  --text-2: var(--muted); --text-3: var(--muted); /* nothing lighter than muted is ever text */
  --rule-2: var(--rule); --hover: var(--surface-2); --active: var(--surface-3); --shadow: var(--float); --backdrop: var(--scrim);
  --bg-2: var(--surface-1); --bg-3: var(--surface-1); --bg-hover: var(--surface-2); --bg-active: var(--surface-3);
  --border: var(--rule); --text-muted: var(--muted); --text-faint: var(--muted); --code-bg: var(--surface-2); --link-missing: var(--danger);
  --accent-soft: var(--accent-wash); --radius: var(--r-2); --font-text: var(--font-ui); }</style>
<style>/* Study: the workstream page's Study tab (renderer/src/app/studyview.js, studyreview.js, studyfile.js). The Tasks | Study switch sits in the
   page header's under-row (.ct-tabs); the pane is one column of sections: Units covered, Memorize, Practice sheets; a deck's list and its
   review replace them. Surfaces, not lines; tokens only. */
.ct-tabs { height: 36px; }
.ct-tabs > button { min-width: 88px; }
.sy-pane { margin-top: 24px; position: relative; }
/* the section bar: sticks at the top of the page while it scrolls */
.sy-nav { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 0; margin-bottom: 16px; background: var(--bg); box-shadow: 0 1px 0 var(--rule); }
.sy-nav > .sy-nav-b { flex: none; width: auto; }
.sy-nav-b { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: var(--r-chip); background: none; color: var(--text); font: inherit; font-size: var(--fs-m); font-weight: 500; cursor: pointer; }
.sy-nav-b:hover { background: var(--surface-2); }
.sy-nav-b .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.sy-nav-b[data-go="upload"] { margin-left: auto; }
.sy-sec { scroll-margin-top: 64px; }
.sy-sec h2:focus { outline: none; } /* a jump target from the section bar, not a control */
.sy-pane .sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.sy-pane .sec-h .act { margin-left: auto; }
.sy-sec + .sy-sec { margin-top: 48px; }
.sy-ico { display: inline-flex; vertical-align: -2px; }
.btn .sy-ico { margin-right: 6px; }
.sy-wait, .sy-empty, .sy-hint { color: var(--muted); font-size: var(--fs-m); }
/* the Study pane is in the other group's copy of the page (view tabs): this copy says so; a click brings it here */
.sy-empty { margin: 4px 0; }
.sy-err { color: var(--danger); font-size: var(--fs-m); }
.sy-warn { color: var(--text); background: var(--warn-tint); border-radius: var(--r-chip); padding: 6px 10px; font-size: var(--fs-s); }
.sy-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sy-pane .sp { flex: 1; }
.sy-pane .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sy-gh { font-size: var(--fs-m); font-weight: 600; color: var(--muted); margin: 20px 0 6px; display: flex; gap: 8px; align-items: baseline; }
.sy-gh .n { font-weight: 400; }
.sy-list > .sy-gh:first-child { margin-top: 8px; }

/* ---- Units covered */
.sy-theme { display: grid; grid-template-columns: minmax(220px, 360px) minmax(0, 1fr); gap: 4px 16px; align-items: center; padding: 2px 0; }
.sy-th { text-align: left; border: 0; background: none; color: var(--text); font: inherit; font-size: var(--fs-s); padding: 4px 8px; border-radius: var(--r-chip); cursor: pointer; display: flex; gap: 8px; justify-content: space-between; align-items: baseline; min-width: 0; }
.sy-th .tn { display: flex; flex-direction: column; min-width: 0; }
.sy-th .tn b { font-weight: 600; font-size: var(--fs-m); }
.sy-th .tn span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sy-th .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sy-th:hover, .sy-th.on { background: var(--surface-2); }
.sy-uchips { display: flex; flex-wrap: wrap; gap: 6px; }
.sy-u { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: var(--r-chip); border: 0; font: inherit; font-size: var(--fs-m); cursor: pointer; background: var(--surface-2); color: var(--text); font-variant-numeric: tabular-nums; }
.sy-u b { font-weight: 600; }
.sy-u[data-status="done"] { background: var(--accent-wash); }
.sy-u[data-status="done"] .sy-ico { color: var(--accent); }
.sy-u[data-status="not-yet"] { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule); }
.sy-u[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.sy-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
[data-status="partial"] .sy-dot { background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px var(--warn); }
.sy-legend { display: flex; gap: 16px; color: var(--muted); font-size: var(--fs-s); margin: 8px 0 0; }
.sy-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sy-legend [data-status="done"] .sy-ico { color: var(--accent); }
.sy-udet { margin: 6px 0 10px; padding: 16px 20px; background: var(--surface-1); border-radius: var(--r-surface); }
.sy-udet-h { display: flex; align-items: center; gap: 10px; }
.sy-udet-h .ttl { font-weight: 600; }
.sy-stat { font-size: var(--fs-s); padding: 2px 8px; border-radius: var(--r-chip); background: var(--surface-2); }
.sy-stat[data-status="done"] { background: var(--accent-wash); }
.sy-stat[data-status="partial"] { background: var(--warn-tint); }
.sy-unote { margin: 10px 0 4px; white-space: pre-line; }
.sy-uev { margin: 4px 0; color: var(--muted); font-size: var(--fs-s); }
.sy-ulist { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 2px; }
.sy-ulist li { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.sy-ulist small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- Memorize */
.sy-deckgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.sy-deck { background: var(--surface-1); border-radius: var(--r-surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sy-deck h3 { margin: 0; font-family: var(--font-display); font-size: var(--fs-hero); font-weight: 600; }
.sy-desc { margin: 0; color: var(--muted); font-size: var(--fs-s); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sy-desc.full { display: block; -webkit-line-clamp: none; }
.sy-dk-n { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0; font-size: var(--fs-m); color: var(--muted); }
.sy-dk-n b { font-family: var(--font-display); font-size: var(--fs-hero); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.sy-dk-n [data-k="due"] b { color: var(--accent); }
.sy-dk-n .of { align-self: end; font-size: var(--fs-s); }
.sy-dk-acts { display: flex; gap: 8px; margin-top: auto; }
.sy-deck.on { box-shadow: inset 0 0 0 2px var(--accent); }
.sy-setup { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px 16px; align-items: start; margin-top: 16px; padding: 18px 20px; background: var(--surface-1); border-radius: var(--r-surface); }
.sy-setup-h { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.sy-setup-h h3 { margin: 0; font-size: var(--fs-base); font-weight: 600; }
.sy-setup .sy-hint { margin: 6px 0 0; font-size: var(--fs-s); }
.sy-lab { color: var(--muted); font-size: var(--fs-s); padding-top: 8px; }
.sy-seg { height: auto; flex-wrap: wrap; row-gap: 3px; }
.sy-seg > button { height: 30px; white-space: nowrap; }
.sy-num { width: 72px; }
.sy-setup .sy-go { grid-column: 1 / -1; }

/* ---- Practice sheets */
.sy-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.sy-q { flex: 1 1 220px; min-width: 180px; }
.sy-sel { flex: 0 1 auto; max-width: 220px; }
.sy-sh { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main tags" "sub files"; gap: 4px 12px; padding: 8px 12px; border-radius: var(--r-control); align-items: center; }
.sy-sh-sub { grid-area: sub; min-width: 0; }
.sy-sh:hover { background: var(--surface-1); }
.sy-sh-main { grid-area: main; min-width: 0; }
.sy-open { border: 0; background: none; padding: 0; font: inherit; color: var(--text); cursor: pointer; text-align: left; max-width: 100%; }
.sy-open .sy-t { font-size: var(--fs-row); font-weight: 600; }
.sy-open:hover .sy-t { text-decoration: underline; text-underline-offset: 3px; }
.sy-sh-sub { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--muted); font-size: var(--fs-s); margin-top: 2px; }
.sy-kind { color: var(--text); }
.sy-dx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }
.sy-sh-tags { grid-area: tags; justify-self: end; display: flex; gap: 4px; align-items: start; flex-wrap: wrap; justify-content: flex-end; max-width: 300px; }
.sy-sh-tags .v-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: var(--r-chip); background: var(--surface-2); color: var(--text); font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.sy-ms[data-ms="none"] { color: var(--muted); background: none; box-shadow: inset 0 0 0 1px var(--rule); }
.sy-ms[data-ms="only"] { background: var(--warn-tint); }
.sy-era[data-era="2025"] { background: var(--accent-wash); }
.sy-code { cursor: pointer; border: 0; font: inherit; }
.sy-code:hover { background: var(--surface-3); }
.sy-sh-files { grid-area: files; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.sy-fbtn { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border: 0; border-radius: var(--r-chip); background: var(--surface-2); color: var(--text); font: inherit; font-size: var(--fs-s); cursor: pointer; }
.sy-fbtn:hover { background: var(--surface-3); }
.sy-fbtn[data-role="ms"] .sy-ico { color: var(--accent); }

.sy-sh-note { grid-column: 1 / -1; margin: 2px 0 0; display: flex; gap: 6px; align-items: baseline; color: var(--muted); font-size: var(--fs-s); white-space: pre-line; }

/* drop files anywhere on Study */
.sy-pane.sy-drop::after { content: 'Drop to file it with Claude'; position: absolute; inset: -12px; border-radius: var(--r-surface); background: color-mix(in srgb, var(--accent-wash) 85%, transparent); box-shadow: inset 0 0 0 2px var(--accent); display: flex; align-items: flex-start; justify-content: center; padding-top: 120px; font-size: var(--fs-hero); font-weight: 600; color: var(--text); pointer-events: none; z-index: 2; }

/* ---- the upload panel */
.sy-up { background: var(--surface-1); border-radius: var(--r-surface); padding: 16px 20px; margin-bottom: 16px; }
.sy-up-h { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sy-up-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sy-ask-row { display: grid; gap: 4px; margin-top: 10px; }
.sy-ask-row label { font-size: var(--fs-s); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sy-tell { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.sy-tell .text-input { flex: 1 1 auto; min-width: 0; }
.sy-up-sum { display: flex; gap: 8px; align-items: baseline; margin: 10px 0 0; }
.sy-up-sum .sy-ico { color: var(--claude); }
.sy-wait-row { display: flex; align-items: center; gap: 10px; color: var(--muted); margin-top: 12px; }
.sy-spin { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--surface-3); border-top: 2px solid var(--claude); animation: sy-spin 900ms linear infinite; }
@keyframes sy-spin { to { transform: rotate(360deg); } }
.sy-model { display: inline-flex; align-items: center; gap: 6px; }
.sy-model .sy-sel { height: 30px; max-width: 240px; }
.sy-unsure { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; }
.sy-secs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 0; }
.sy-sec-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: var(--r-chip); background: var(--surface-2); font-size: var(--fs-s); }
.sy-notes { width: 100%; max-width: 560px; min-height: 52px; resize: vertical; font: inherit; }
.sy-dups { display: grid; gap: 4px; }
.sy-dup { margin: 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: var(--fs-m); padding: 4px 8px; border-radius: var(--r-chip); }
.sy-dup.exact { background: var(--danger-tint); }
.sy-dup.near { background: var(--warn-tint); }
.sy-dup.claude .sy-ico { color: var(--claude); }
.sy-form { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 14px; align-items: center; }
.sy-form label { color: var(--muted); font-size: var(--fs-s); }
.sy-form > div { display: flex; gap: 8px; flex-wrap: wrap; }
.sy-form .sel-input, .sy-form .text-input { width: 100%; max-width: 560px; }
.sy-form > div .sel-input, .sy-form > div .text-input { flex: 1 1 240px; }
.sy-where { margin: 12px 0; font-size: var(--fs-m); overflow-wrap: anywhere; }
.sy-go { margin-top: 8px; }

/* ---- review */
.sy-rv, .sy-dl { outline: none; }
.sy-rv-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
.sy-rv-t { display: flex; flex-direction: column; min-width: 0; }
.sy-rv-t span { color: var(--muted); font-size: var(--fs-s); }
.sy-rv-n { color: var(--muted); font-size: var(--fs-m); font-variant-numeric: tabular-nums; }
.sy-bar-p { height: 4px; border-radius: 2px; background: var(--surface-2); margin: 12px 0 0; overflow: hidden; }
.sy-bar-p i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width var(--d-base) var(--ease); }
.sy-card { margin: 40px auto 0; max-width: 680px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.sy-kick { color: var(--muted); font-size: var(--fs-s); margin: 0; }
.sy-prompt { font-family: var(--font-display); font-size: var(--fs-title); line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.sy-answer { font-family: var(--font-display); font-size: 36px; line-height: 1.15; margin: 0; color: var(--accent); overflow-wrap: anywhere; }
.sy-fields { color: var(--muted); margin: 0; }
.sy-note { color: var(--muted); font-size: var(--fs-m); margin: 0; max-width: 600px; }
.sy-flip kbd, .sy-g kbd, .sy-opt kbd { margin-left: 8px; }
.sy-typerow { justify-content: center; width: 100%; }
.sy-type { flex: 1 1 auto; max-width: 420px; font-size: var(--fs-hero); height: 48px; text-align: center; }
.sy-result { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 600; }
.sy-result[data-result="right"] { color: var(--accent); }
.sy-result[data-result="case"] { color: var(--warn); }
.sy-result[data-result="wrong"], .sy-result[data-result="empty"] { color: var(--danger); }
.sy-you { font-weight: 400; color: var(--text); }
.sy-mcq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.sy-opt { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; border: 0; border-radius: var(--r-control); background: var(--surface-1); color: var(--text); font: inherit; font-size: var(--fs-row); text-align: left; cursor: pointer; }
.sy-opt kbd { margin: 0; }
.sy-opt .ot { flex: 1; }
.sy-opt:hover:not(:disabled) { background: var(--surface-2); }
.sy-opt:disabled { cursor: default; color: var(--muted); }
.sy-opt.right { background: var(--accent-wash); color: var(--text); }
.sy-opt.wrong { background: var(--danger-tint); color: var(--text); }
.sy-grades, .sy-end { scroll-margin-bottom: var(--page-bottom); }
.sy-grades { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.btn.sy-g { height: auto; min-height: 56px; flex-direction: column; display: inline-flex; align-items: center; justify-content: center; gap: 2px; padding: 6px 16px; min-width: 112px; }
.sy-g .gl { display: inline-flex; align-items: center; }
.btn.sy-g kbd { margin: 0; }
.sy-g small { font-size: var(--fs-xs); opacity: .8; }
.sy-end { margin: 48px auto 0; max-width: 560px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.sy-end h2 { font-family: var(--font-display); font-size: var(--fs-fig); margin: 0; }

/* ---- rule cards' members, and Practice classifying */
.sy-covers { display: block; color: var(--muted); font-size: var(--fs-s); margin: 2px 0 0; }
.sy-tbl .sy-covers { font-size: var(--fs-xs); color: var(--text); max-width: 420px; }
.sy-pr-formula { font-family: var(--font-display); font-size: var(--fs-fig); margin: -8px 0 0; color: var(--muted); }
.sy-pr-rule { width: 100%; max-width: 600px; text-align: left; background: var(--surface-1); border-radius: var(--r-surface); padding: 14px 18px; }
.sy-pr-rule-t { margin: 4px 0; font-size: var(--fs-base); }
.sy-pr-missed { text-align: left; margin: 8px 0; padding-left: 18px; font-size: var(--fs-m); }
.sy-dl-practice { margin-top: 24px; }
:is(#sy-pr-next, [data-gid-id="sy-pr-next"]) { scroll-margin-bottom: var(--page-bottom); }
.sy-dl-practice summary { cursor: pointer; color: var(--muted); font-size: var(--fs-m); }

/* ---- a deck's list */
.sy-dl-t { font-family: var(--font-display); font-size: var(--fs-fig); margin: 24px 0 4px; }
.sy-dl .sy-q { max-width: 360px; margin: 12px 0 4px; display: block; }
.sy-tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-m); }
.sy-tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: var(--fs-s); padding: 4px 12px 4px 0; }
.sy-tbl td { padding: 8px 12px 8px 0; vertical-align: top; box-shadow: inset 0 -1px 0 var(--rule); }
.sy-tbl td:first-child { min-width: 160px; }
.sy-cnote { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: var(--fs-xs); margin-top: 2px; max-width: 360px; }
.sy-lvl { height: 22px; font-size: var(--fs-xs); }
.sy-lvl[data-level="required"] { background: var(--accent-wash); }
.sy-mem { color: var(--muted); white-space: nowrap; }
.sy-mem[data-mem="due"] { color: var(--accent); font-weight: 600; }
.sy-srcs ul { margin: 0; padding-left: 18px; font-size: var(--fs-s); }
.sy-srcs li { margin: 2px 0; }
.sy-srcs .v-link { text-align: left; font-weight: 500; }

@container main (max-width: 900px) {
  .sy-theme { grid-template-columns: minmax(0, 1fr); }
  .sy-sh { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main" "sub" "tags" "files"; }
  .sy-sh-tags, .sy-sh-files { justify-content: flex-start; justify-self: start; max-width: none; }
  .sy-form { grid-template-columns: minmax(0, 1fr); }
  .sy-mcq { grid-template-columns: minmax(0, 1fr); }
}

/* ---- The VSEPR chart (app/studyvsepr.js, a chemistry workstream's Study tab): the grid and, beside it, the picked shape as a model to turn.
   Under the width of both, the panel goes below the grid and lays its model beside its facts. A split group narrower than the grid scrolls it. */
.sy-vs-body { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.sy-vs-main { min-width: 0; }
.sy-vs-scroll { overflow-x: auto; }
.sy-vsg { display: grid; grid-template-columns: 18px 18px 30px repeat(6, minmax(108px, 1fr)); grid-template-rows: auto auto repeat(4, auto); gap: 3px; min-width: 714px; }
.sy-vs-axis { color: var(--muted); font-size: var(--fs-xs); }
.sy-vs-axis.x { grid-column: 3 / -1; grid-row: 1; text-align: center; }
.sy-vs-axis.y { grid-column: 1; grid-row: 3 / span 4; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; }
.sy-vs-n { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 20px; border-radius: var(--r-kbd); color: var(--muted); font-size: var(--fs-s); font-variant-numeric: tabular-nums; }
.sy-vs-n.on { background: var(--surface-3); color: var(--text); font-weight: 600; }
.sy-vs-zero { grid-column: 3; grid-row: 3 / span 4; display: flex; align-items: center; justify-content: center; border-radius: var(--r-chip); box-shadow: inset 0 0 0 1px var(--rule); color: var(--muted); font-size: var(--fs-xs); writing-mode: vertical-rl; transform: rotate(180deg); }
.sy-vs-blank { border-radius: var(--r-chip); box-shadow: inset 0 0 0 1px var(--rule); opacity: .6; }
.sy-vsc { display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 5px 6px 7px; border: 0; border-radius: var(--r-chip); background: var(--surface-1); color: var(--text); font: inherit; text-align: center; line-height: 1.25; cursor: pointer; }
.sy-vsc:hover { background: var(--surface-2); }
.sy-vsc.fam { background: var(--accent-wash); }
.sy-vsc[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.sy-vsc[data-ib="false"]:not(.fam) { background: none; box-shadow: inset 0 0 0 1px var(--rule); }
.sy-vsc[data-ib="false"][aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.sy-vsc .t { display: flex; justify-content: space-between; align-self: stretch; min-height: 15px; font-size: var(--fs-xs); }
.sy-vsc .ex { color: var(--muted); }
.sy-vsc .hy, .sy-vs-fam .hy { font-weight: 600; }
.sy-vsc .pic { display: flex; height: 60px; align-items: center; justify-content: center; }
.sy-vsc .mg { font-size: var(--fs-s); font-weight: 600; }
.sy-vsc .eg { color: var(--muted); font-size: var(--fs-xs); }
.sy-vsc .ang { font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.sy-vs-fams { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0 69px; }
.sy-vs-fam { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: var(--r-chip); background: var(--surface-1); color: var(--text); font: inherit; font-size: var(--fs-s); cursor: pointer; }
.sy-vs-fam:hover { background: var(--surface-2); }
.sy-vs-fam[aria-pressed="true"] { background: var(--accent-wash); }
.sy-vs-fam .hy { color: var(--muted); }
.sy-vs-foot { margin: 8px 0 0 69px; color: var(--muted); font-size: var(--fs-s); line-height: 1.45; }
/* the panel beside the grid */
.sy-vsd { position: sticky; top: 64px; padding: 12px 14px 14px; background: var(--surface-1); border-radius: var(--r-surface); }
.sy-vsd-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.sy-vsd-h .ttl { min-width: 0; }
.sy-vsd-h h3 { margin: 0; font-size: var(--fs-base); font-weight: 600; line-height: 1.25; }
.sy-vsd-h .note { margin: 2px 0 0; color: var(--muted); font-size: var(--fs-s); }
.sy-vsd-h .seg { flex: none; }
.sy-vsd-model { display: flex; justify-content: center; margin-top: 4px; border-radius: var(--r-chip); cursor: grab; touch-action: none; user-select: none; }
.sy-vsd-model.drag { cursor: grabbing; }
.sy-vsd-model:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sy-vs-hint { margin: 0; color: var(--muted); font-size: var(--fs-xs); text-align: center; }
.sy-vsd dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 10px 0 0; font-size: var(--fs-s); }
.sy-vsd dt { color: var(--muted); }
.sy-vsd dd { margin: 0; }
.sy-vsd-note { margin: 8px 0 0; font-size: var(--fs-s); line-height: 1.45; }
.sy-vs-svg { display: block; flex: none; }
.sy-vs-a0 { fill: var(--text); }
.sy-vs-a1 { fill: var(--accent); }
.sy-vs-bond, .sy-vs-hash { stroke: var(--text); fill: none; }
.sy-vs-wedge { fill: var(--text); }
.sy-vs-lp { fill: var(--warn-tint); stroke: var(--warn); stroke-width: 1; }
.sy-vs-e { fill: var(--warn); }
.sy-vs-edge { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.sy-vs-arc { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.sy-vs-lab { fill: var(--text); font-size: 12px; font-weight: 600; paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; }
@container main (max-width: 1150px) {
  .sy-vs-body { grid-template-columns: minmax(0, 1fr); }
  .sy-vsd { position: static; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 4px 20px; }
  .sy-vsd-h { grid-column: 1 / -1; }
  .sy-vsd dl { margin-top: 0; }
}

/* the Enthalpies section (app/studyenthalpy.js) */
.sy-en .sec-h { flex-wrap: wrap; align-items: center; }
.sy-en #sy-en-tabs { margin-left: auto; }
.sy-en-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.sy-en-comps { display: flex; flex-wrap: wrap; gap: 4px; }
.sy-en-comp { height: 32px; padding: 0 10px; border: 0; border-radius: var(--r-chip); background: var(--surface-1); color: var(--text); font: inherit; font-size: var(--fs-s); cursor: pointer; }
.sy-en-comp:hover { background: var(--surface-2); }
.sy-en-comp[aria-pressed="true"] { background: var(--accent-wash); font-weight: 600; }
.sy-en-tools { display: flex; align-items: center; gap: 6px; }
.sy-en-tools .note { color: var(--muted); font-size: var(--fs-s); }
.sy-en .btn { height: 32px; padding: 0 12px; }
.sy-en-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.sy-en-main { min-width: 0; }
.sy-en-dia { padding: 8px; background: var(--surface-1); border-radius: var(--r-surface); }
.sy-en-svg { display: block; width: 100%; height: auto; }
.sy-en-svg text, .sy-en-route text { fill: var(--text); font-size: 13px; }
.sy-en-svg text.sp.b, .sy-en-route text.b { font-weight: 600; }
.sy-en-svg text.v, .sy-en-route text.v { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sy-en-route text.ts { fill: var(--muted); font-size: 11px; }
.sy-en-svg .lv { stroke: var(--text); stroke-width: 1.5; }
.sy-en-svg .lv.base { stroke-width: 2.5; }
.sy-en-svg .ar, .sy-en-route .ar { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.sy-en-svg .ar.lat { stroke: var(--text); }
.sy-en-svg .guide { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.sy-en-svg .hit { fill: transparent; }
.sy-en-svg .st { cursor: pointer; outline: none; }
.sy-en-svg .st:hover .hit { fill: var(--surface-2); }
.sy-en-svg .st:focus-visible .hit { stroke: var(--accent); stroke-width: 1.5; }
.sy-en-svg .st.on .ar, .sy-en-svg .st.on .lv { stroke: var(--accent); stroke-width: 2.5; }
.sy-en-svg .st.on text.v { fill: var(--accent); }
.sy-en-svg .st.dim { opacity: .22; }
.sy-en-sum { margin-top: 10px; font-size: var(--fs-s); }
.sy-en-sumh, .sy-en-sumr { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px; gap: 8px; align-items: center; padding: 3px 8px; }
.sy-en-sumh { color: var(--muted); font-size: var(--fs-xs); }
.sy-en-sumh span + span, .sy-en-sumr .v, .sy-en-sumr .t { text-align: right; font-variant-numeric: tabular-nums; }
.sy-en-sumr { width: 100%; min-height: 26px; border: 0; border-radius: var(--r-kbd); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.sy-en-sumr:hover { background: var(--surface-2); }
.sy-en-sumr[aria-pressed="true"] { background: var(--accent-wash); }
.sy-en-sumr .t { color: var(--muted); }
.sy-en-foot { margin-left: 8px; }
.sy-en-det { position: sticky; top: 64px; padding: 12px 14px 14px; background: var(--surface-1); border-radius: var(--r-surface); font-size: var(--fs-s); line-height: 1.45; }
.sy-en-det h3, .sy-en-route-p h3 { margin: 0; font-size: var(--fs-base); font-weight: 600; line-height: 1.25; }
.sy-en-det .big { margin-top: 4px; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sy-en-det .big .note { color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.sy-en .eq { margin: 8px 0 0; font-size: var(--fs-s); font-weight: 600; }
.sy-en-det p { margin: 8px 0 0; }
.sy-en-det dl, .sy-en-open dl, .sy-en-route-p dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 10px 0 0; font-size: var(--fs-s); }
.sy-en dt { color: var(--muted); }
.sy-en dd { margin: 0; }
.sy-en-quiz { margin-top: 10px; }
.sy-en-quiz label { display: block; margin-bottom: 4px; color: var(--muted); }
.sy-en-qrow { display: flex; align-items: center; gap: 6px; }
.sy-en-qrow .input { flex: 1 1 80px; width: 80px; min-width: 0; height: 32px; }
.sy-en-qrow .note { flex: none; color: var(--muted); }
.sy-en-quiz .say { margin: 6px 0 0; }
.sy-en-quiz .say.right { color: var(--ok, var(--accent)); font-weight: 600; }
.sy-en-quiz .say.sign, .sy-en-quiz .say.wrong { color: var(--danger); }
.sy-en-quiz #sy-en-show { margin-top: 8px; }
.sy-en-work { margin: 8px 0 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
.sy-en-terms { display: flex; flex-direction: column; gap: 3px; }
.sy-en-term { background: var(--surface-1); border-radius: var(--r-chip); }
.sy-en-termb { display: grid; grid-template-columns: minmax(0, 1.3fr) 72px minmax(0, 1fr) 150px; gap: 10px; align-items: center; width: 100%; min-height: 36px; padding: 4px 10px; border: 0; border-radius: var(--r-chip); background: none; color: var(--text); font: inherit; font-size: var(--fs-s); text-align: left; cursor: pointer; }
.sy-en-termb:hover { background: var(--surface-2); }
.sy-en-termb b { font-weight: 600; }
.sy-en-termb .sign, .sy-en-termb .bk { color: var(--muted); }
.sy-en-flag { justify-self: start; padding: 1px 7px; border-radius: var(--r-kbd); background: var(--warn-tint); color: var(--text); font-size: var(--fs-xs); font-weight: 600; }
.sy-en-open { padding: 2px 10px 12px; font-size: var(--fs-s); line-height: 1.45; }
.sy-en-open p { margin: 6px 0 0; }
.sy-en-flagnote { padding: 4px 8px; border-radius: var(--r-kbd); background: var(--warn-tint); }
.sy-en-meth { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
.sy-en-have { display: flex; flex-direction: column; gap: 3px; }
.sy-en-have .note { color: var(--muted); font-size: var(--fs-s); }
.sy-en-haveb { min-height: 34px; padding: 0 10px; border: 0; border-radius: var(--r-chip); background: var(--surface-1); color: var(--text); font: inherit; font-size: var(--fs-s); text-align: left; cursor: pointer; }
.sy-en-haveb:hover { background: var(--surface-2); }
.sy-en-haveb[aria-pressed="true"] { background: var(--accent-wash); font-weight: 600; }
.sy-en-route-p { padding: 12px 14px 14px; background: var(--surface-1); border-radius: var(--r-surface); }
.sy-en-route-p .pic { margin-top: 8px; }
.sy-en-route { display: block; width: 100%; max-width: 420px; height: auto; }
.sy-en-route-p #sy-en-tocycle { margin-top: 10px; }
@media (max-width: 1180px) {
  .sy-en-grid { grid-template-columns: minmax(0, 1fr); }
  .sy-en-det { position: static; }
}

/* ---- Molecules (app/studymol.js): the tool itself is in a shadow root; only the side panel's frame is here */
.mol-panel { position: fixed; top: max(12px, calc(var(--win-top, 0px) + 8px)); right: 12px; bottom: 12px; width: min(520px, calc(100vw - 24px)); z-index: 60; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; overflow-y: auto; background: var(--bg); border: 1px solid var(--rule); border-radius: var(--r-surface); box-shadow: 0 8px 28px rgba(0, 0, 0, .22); }
.mol-panel[hidden] { display: none; }
.mol-panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mol-panel-h h2 { margin: 0; font: 600 18px/24px var(--font-display); }
.mol-panel-x { border: 0; background: none; color: var(--muted); width: 28px; height: 28px; border-radius: var(--r-control); cursor: pointer; }
.mol-panel-x:hover { background: var(--surface-2); }

*{box-sizing:border-box}
[hidden]{display:none!important}
h2{font:600 20px/26px var(--display);margin:0;text-wrap:balance}
h3{font:600 15px/20px var(--display);margin:0}
p{margin:0;max-width:68ch}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{height:36px;padding:0 13px;border:0;border-radius:10px;background:var(--s2);font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--s3)}
#tool{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 200px;min-width:0;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--s1);padding:0 14px;font-size:16px}
.search button{height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.mine{display:grid;gap:6px}
.mine h3{font:500 12px/16px var(--ui);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:stretch;border-radius:8px;background:var(--s1);overflow:hidden}
.chip button{border:0;background:none;font-size:14px;line-height:20px;padding:3px 3px 3px 9px}
.chip button.x{padding:3px 7px 3px 4px;color:var(--muted);font-size:13px}
.chip:hover{background:var(--s2)}
.chip.on{background:var(--accent)}
.chip.on button{color:var(--on-accent)}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.head .f{font:700 34px/40px var(--display)}
.head .n{color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--s2);border-radius:7px;padding:1px 8px;font-size:13px;line-height:20px}
.tag.res{background:var(--accent-tint);color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--s1);border-radius:14px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--s2);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:3px 9px;font-size:13px;line-height:18px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);font-weight:500}
.stage{background:var(--bg);border-radius:10px;min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-height:360px}
#model{touch-action:none;cursor:grab}
#model:active{cursor:grabbing}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.steps{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.bar{display:flex;gap:4px}
.bar button{flex:1;border:0;background:var(--s3);height:30px;border-radius:7px;font:500 13px/1 var(--mono);color:var(--muted);min-width:0}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.say{min-height:66px}
.say b{font-weight:600}
.say .sum{font:400 13px/20px var(--mono);color:var(--muted);display:block;margin-top:2px;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border-radius:12px;overflow:hidden}
.fact{background:var(--s1);padding:9px 12px;min-width:0}
.fact small{display:block;color:var(--muted);font-size:12px;line-height:16px}
.fact b{font-weight:600;font-size:15px;line-height:21px}
.at{color:var(--muted);font-size:14px}
.at b{color:var(--text);font-weight:600}
.lower{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:2px 8px}
td{padding:3px 8px;text-align:right;border-top:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left;padding-left:0}
.fc-p{color:var(--plus);font-weight:600}.fc-m{color:var(--minus);font-weight:600}
.formula{font:400 13px/18px var(--mono);color:var(--muted)}

.btn.alt{height:44px;border-radius:12px;background:var(--s2);color:var(--text);padding:0 14px}
.btn.prime{background:var(--accent);color:var(--on-accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.seg button.addel{color:var(--accent);font-weight:600}
.ptable{position:absolute;z-index:20;top:calc(100% + 6px);left:0;max-width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:grid;gap:6px}

.ptnote{font-size:12px;line-height:16px;color:var(--muted);max-width:none}
.boardwrap{position:relative;background:var(--bg);border-radius:10px;overflow:hidden}
#board{display:block;width:100%;height:clamp(340px,58vh,760px);touch-action:none;cursor:crosshair}
#board.moving{cursor:grab}#board.moving:active{cursor:grabbing}
.zoomer{position:absolute;top:8px;right:8px;display:flex;gap:2px;background:var(--s2);border-radius:9px;padding:2px}

.zoomer button:hover{background:var(--bg)}
.grid.draw{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}

[data-card]>.panel>.ph h3::before,[data-card]>.ph h3::before{content:"\u283F";color:var(--muted);margin-right:6px}
.grid.draw.dragging [data-card]{opacity:.72}
.dropmark{position:fixed;z-index:30;background:var(--hyb-tint);border:2px solid var(--accent);border-radius:12px;pointer-events:none}

.grid.draw{order:-1}
#board{user-select:none;-webkit-user-select:none}
.grid.draw .stage{min-height:190px}.grid.draw .stage svg{max-height:230px}

#editor{background:var(--s1)}

.orbpick{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tick{border:0;background:var(--s2);border-radius:7px;padding:2px 8px;font-size:13px;line-height:19px}
.tick[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.verify{display:grid;gap:4px;font-size:14px;line-height:20px;background:var(--bg);border-radius:10px;padding:10px 12px}

#drawStatus{flex:1 1 200px;min-width:0;color:var(--text)}
.bench{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.labeler{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.legendmk{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px}
.mk{display:inline-flex;align-items:center;gap:5px}
.mk i{width:11px;height:11px;border-radius:6px;background:var(--c);opacity:.75}
.mk button{border:0;background:none;color:var(--muted);padding:0 2px}
.lasso{position:absolute;border:1.5px dashed var(--accent);background:var(--hyb-tint);pointer-events:none}
.note{background:var(--warn-tint);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px;line-height:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.note span{flex:1 1 220px;min-width:0}
.refuse{background:var(--s1);border-radius:14px;padding:18px;display:grid;gap:6px}
.vb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.rows{display:grid;gap:10px;min-width:0}
.row small{display:block;color:var(--muted);font-size:12px;line-height:16px;margin-bottom:3px}
.boxes{display:flex;flex-wrap:wrap;gap:3px 3px}
.box{display:grid;justify-items:center;gap:1px;width:42px}
.box b{display:flex;align-items:center;justify-content:center;width:100%;height:30px;background:var(--bg);border:1px solid var(--s3);border-radius:5px;font:500 15px/1 var(--mono);letter-spacing:-1px}
.box.h b{border-color:var(--accent)}.box.p b{border-color:var(--pi)}
.box em{font:400 10.5px/13px var(--mono);font-style:normal;color:var(--muted)}
.vbbonds{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:14px}
