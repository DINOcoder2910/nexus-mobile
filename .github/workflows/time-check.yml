name: Time check (simulator)

# Runs UITests/TimeTrackingTests on an iPad and an iPhone simulator and prints its "time-…" screenshots into the log as base64 JPEGs,
# so a cloud thread (which can't download artifacts) can see time tracking on both before asking for a ship.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["UITests/TimeTrackingTests.swift", ".github/workflows/time-check.yml", "Sources/Time/**"]

concurrency:
  group: time-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        device: [iPad, iPhone]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          want=sys.argv[1]
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith(want)]
          pref="iPad Pro" if want=="iPad" else "Pro Max"
          c.sort(key=lambda x: ((pref not in x["name"]), x["name"]))
          print(c[0]["udid"]); print(c[0]["name"], file=sys.stderr)' "${{ matrix.device }}")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | grep -E "error:|BUILD|\*\*" | head -n 100

      - name: Run the time tests
        run: |
          set +e
          xcodebuild test-without-building -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            -only-testing:NexusMobileUITests/TimeTrackingTests -resultBundlePath ui.xcresult 2>&1 | tee ui.log \
            | grep -E "UISTEP|Test Case|error|failed|passed|XCTAssert" | head -n 200
          echo "${PIPESTATUS[0]}" > status.txt

      - name: Screenshots in the log (base64 JPEG)
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path ui.xcresult --output-path shots 2>&1 | tail -n 3 || true
          python3 -c '
          import json
          for t in json.load(open("shots/manifest.json")):
              for a in t.get("attachments",[]):
                  n=a.get("suggestedHumanReadableName","")
                  if n.startswith("time-"): print(a["exportedFileName"] + "\t" + n.split("_")[0])' > wanted.txt 2>/dev/null || true
          while IFS="$(printf '\t')" read -r F N; do
            [ -n "$F" ] || continue
            sips -Z 1400 -s format jpeg -s formatOptions 62 "shots/$F" --out "x.jpg" >/dev/null || continue
            echo "SHOT-BEGIN ${{ matrix.device }}-$N.jpg $(stat -f%z x.jpg)"
            base64 -i x.jpg | fold -w 3000
            echo "SHOT-END"
          done < wanted.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-check-${{ matrix.device }}
          path: |
            shots
            ui.log

      - name: Result
        if: always()
        run: exit $(cat status.txt 2>/dev/null || echo 1)
