name: Spanish check (iPhone and iPad simulators)

# The Spanish screens' UI tests (UITests/SpanishPadTests.swift on an iPad, UITests/SpanishPhoneTests.swift on an iPhone; each skips
# itself on the other device), with their screenshots ("pad-spanish-…", "phone-spanish-…") printed in the log as base64 JPEGs for a
# reader that can't download artifacts. Run by hand, or on a push to a branch that touches Spanish.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["Sources/Spanish/**", "UITests/Spanish*.swift", ".github/workflows/spanish-check.yml"]

concurrency:
  group: spanish-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spanish:
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("${{ matrix.device }}")]
          c.sort(key=lambda x: (("Pro" not in x["name"]) or ("Max" in x["name"]), x["name"]))
          print(c[0]["udid"], c[0]["name"], file=sys.stderr)
          print(c[0]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | grep -E "error:|BUILD|\*\*" | head -n 100

      - name: Run the tests
        timeout-minutes: 30
        run: |
          echo 1 > status.txt
          CLASS=$([ "${{ matrix.device }}" = iPad ] && echo SpanishPadTests || echo SpanishPhoneTests)
          # every 5 s: if the app is running, a 1 s sample of all its threads (a freeze shows where the app is stuck)
          mkdir -p samples
          ( while true; do
              PID=$(pgrep -x NexusMobile | head -n 1)
              if [ -n "$PID" ]; then sudo sample "$PID" 1 -mayDie -file "samples/s-$(date +%s).txt" >/dev/null 2>&1; fi
              sleep 4
            done ) &
          SAMPLER=$!
          set +e
          xcodebuild test-without-building -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            -only-testing:NexusMobileUITests/$CLASS -resultBundlePath es.xcresult 2>&1 | tee es.log | grep -E "UISTEP|Test Case|error|failed|passed|skipped"
          STATUS=${PIPESTATUS[0]}
          kill $SAMPLER || true
          echo "xcodebuild test exited $STATUS"
          echo "$STATUS" > status.txt

      - name: Main thread in the last samples (only when the tests failed)
        if: always()
        run: |
          [ "$(cat status.txt 2>/dev/null)" = 0 ] && { echo "tests passed"; exit 0; }
          for f in $(ls samples/*.txt 2>/dev/null | tail -n 4); do
            echo "=================== $f"
            awk '/Thread_[0-9]+.*com.apple.main-thread/{on=1} on{print; n++} n>=70{exit}' "$f" | cut -c1-200
          done

      - name: Screenshots in the log (base64 JPEG)
        if: always()
        run: |
          mkdir -p esshots
          xcrun xcresulttool export attachments --path es.xcresult --output-path esshots 2>&1 | tail -n 3 || true
          python3 -c '
          import json
          for t in json.load(open("esshots/manifest.json")):
              for a in t.get("attachments",[]):
                  n=a.get("suggestedHumanReadableName","")
                  if n.startswith("phone-spanish") or n.startswith("pad-spanish"): print(a["exportedFileName"] + "\t" + n.split("_")[0])' > eswanted.txt 2>/dev/null || true
          while IFS=$'\t' read -r F N; do
            [ -f "esshots/$F" ] || continue
            sips -Z 1400 -s format jpeg -s formatOptions 60 "esshots/$F" --out "$N.jpg" >/dev/null || continue
            echo "SHOT-BEGIN $N.jpg $(stat -f%z "$N.jpg")"
            base64 -i "$N.jpg" | fold -w 3000
            echo "SHOT-END"
          done < eswanted.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spanish-check-${{ matrix.device }}
          path: |
            esshots
            es.log

      # last, so a reader that sees only the log's end still sees which tests failed and why
      - name: Test summary
        if: always()
        run: |
          grep -E "UISTEP|Test Case .*(passed|failed|skipped)|error: -\[|XCTAssert|Executed [0-9]+ test" es.log 2>/dev/null | cut -c1-400 | tail -n 100 || true
          exit $(cat status.txt 2>/dev/null || echo 1)
