name: UI check (simulator)

# Drives the app in an iPad simulator (UITests/) on a GitHub-hosted Mac, sampling the app's main thread every few seconds, so a
# freeze shows where the app is stuck. Run by hand (Actions › UI check › Run workflow), or on a push to a branch that touches UITests/.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["UITests/**", ".github/workflows/ui-check.yml"]

concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPad simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if "iPad" in x["name"]]
          c.sort(key=lambda x: (("iPad Pro" not in x["name"]), x["name"]))
          print(c[0]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | grep -E "error:|BUILD|\*\*" | head -n 100

      - name: Run the UI tests, sampling the app
        run: |
          mkdir -p samples
          # every 5 s: if the app is running, a 1 s sample of all its threads
          ( while true; do
              PID=$(pgrep -x NexusMobile | head -n 1)
              if [ -n "$PID" ]; then sudo sample "$PID" 1 -mayDie -file "samples/s-$(date +%s).txt" >/dev/null 2>&1; fi
              sleep 4
            done ) &
          SAMPLER=$!
          set +e
          xcodebuild test-without-building -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            -resultBundlePath ui.xcresult 2>&1 | tee ui.log | grep -E "UISTEP|Test Case|error|failed|passed|Hang|hang" | head -n 300
          STATUS=${PIPESTATUS[0]}
          kill $SAMPLER || true
          echo "xcodebuild test exited $STATUS"
          echo "$STATUS" > status.txt

      - name: Main thread in each sample
        if: always()
        run: |
          for f in samples/*.txt; do
            [ -f "$f" ] || continue
            echo "=================== $f"
            # the main thread's call tree, cut short
            awk '/Thread_[0-9]+.*com.apple.main-thread/{on=1} on{print; n++} n>=90{exit}' "$f" | cut -c1-220
          done

      - name: Freeze reports the app wrote
        if: always()
        run: |
          DATA=$(xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" app.nexus.mobile data 2>/dev/null || true)
          echo "app data: $DATA"
          ls -la "$DATA/Documents/nexus-data/diagnostics" 2>/dev/null || echo "no diagnostics folder"
          for f in "$DATA"/Documents/nexus-data/diagnostics/*.txt; do [ -f "$f" ] && { echo "=================== $f"; cat "$f"; }; done

      - name: Screenshots the tests took, as PNGs
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path ui.xcresult --output-path shots 2>&1 | tail -n 5 || true
          ls shots | head -n 50

      - name: Screenshots in the log (base64 JPEG, for a reader that can't download artifacts)
        if: always()
        run: |
          python3 -c '
          import json
          m=json.load(open("shots/manifest.json"))
          for t in m:
              for a in t.get("attachments",[]):
                  n=a.get("suggestedHumanReadableName","")
                  if n.startswith("sidebar") or n.startswith("tutor-") or n.startswith("ideas-"): print(a["exportedFileName"] + "\t" + n.split("_")[0])' > wanted.txt 2>/dev/null || true
          [ -s wanted.txt ] || { echo "no shots to print"; exit 0; }
          while IFS="$(printf '\t')" read -r F N; do
            sips -Z 1400 -s format jpeg -s formatOptions 60 "shots/$F" --out "$N.jpg" >/dev/null || continue
            echo "SHOT-BEGIN $N.jpg $(stat -f%z "$N.jpg")"
            base64 -i "$N.jpg" | fold -w 3000
            echo "SHOT-END"
          done < wanted.txt

      - name: Rich-text screenshots in the log (base64 JPEGs, for a reader that can't download artifacts)
        if: always()
        run: |
          mkdir -p shots rich
          [ -f shots/manifest.json ] || xcrun xcresulttool export attachments --path ui.xcresult --output-path shots 2>&1 | tail -n 5 || true
          python3 - <<'PY' > rich/list.txt || true
          import json
          want = ("block opened", "typed on the board", "closed on the board", "reopened on the board", "writing view", "back on the board", "whole block")
          for t in json.load(open("shots/manifest.json")):
              test = t.get("testIdentifier", "")
              if "RichText" not in test: continue
              mode = "dark" if "Dark" in test else "light"
              for a in t.get("attachments", []):
                  n = a.get("suggestedHumanReadableName", "")
                  if n.startswith(want):
                      tag = mode + "-" + n.split("_")[0].split(" (")[0].replace(" ", "-")
                      print(a["exportedFileName"] + "\t" + tag)
          PY
          while IFS=$'\t' read -r f tag; do
            [ -f "shots/$f" ] || continue
            sips -Z 1400 -s format jpeg -s formatOptions 60 "shots/$f" --out "rich/$tag.jpg" >/dev/null
            echo "SHOT-BEGIN $tag.jpg $(stat -f%z "rich/$tag.jpg")"
            base64 -i "rich/$tag.jpg" | fold -w 3000
            echo "SHOT-END"
          done < rich/list.txt

      - name: PDF zoom screenshots in the log (base64 JPEG)
        if: always()
        run: |
          python3 -c '
          import json
          m=json.load(open("shots/manifest.json"))
          for t in m:
              for a in t.get("attachments",[]):
                  n=a.get("suggestedHumanReadableName","")
                  if n.startswith("zoom-"): print(a["exportedFileName"] + "\t" + n)' 2>/dev/null > zoomshots.txt || true
          while IFS=$'\t' read -r F N; do
            [ -n "$F" ] || continue
            sips -Z 1200 -s format jpeg -s formatOptions 60 "shots/$F" --out z.jpg >/dev/null
            echo "SHOT-BEGIN $N $(stat -f%z z.jpg)"
            base64 -i z.jpg | fold -w 3000
            echo "SHOT-END"
          done < zoomshots.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: |
            shots
            samples
            ui.log
            ui.xcresult

      - name: Result
        if: always()
        run: exit $(cat status.txt 2>/dev/null || echo 1)

  # The iPhone, beside the iPad job: every UI test class named "…PhoneTests" (each skips itself on the iPad) on an iPhone simulator.
  # Its screenshots whose name has "phone" are printed in the log like the iPad's.
  phone:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x: (("Pro" not in x["name"]) or ("Max" in x["name"]), x["name"]))
          print(c[0]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | grep -E "error:|BUILD|\*\*" | head -n 100

      - name: Run the iPhone tests
        timeout-minutes: 25
        run: |
          echo 1 > status.txt
          ONLY=$(grep -ho "class [A-Za-z0-9_]*PhoneTests" UITests/*.swift | awk '{print "-only-testing:NexusMobileUITests/" $2}' | sort -u | tr '\n' ' ')
          [ -n "$ONLY" ] || { echo "no iPhone tests"; echo 0 > status.txt; exit 0; }
          echo "running: $ONLY"
          set +e
          xcodebuild test-without-building -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData $ONLY \
            -resultBundlePath phone.xcresult 2>&1 | tee phone.log | grep -E "UISTEP|Test Case|error|failed|passed|skipped"
          STATUS=${PIPESTATUS[0]}
          echo "xcodebuild test exited $STATUS"
          echo "$STATUS" > status.txt

      - name: The test log's end (when it stopped early)
        if: always()
        run: tail -n 40 phone.log 2>/dev/null | cut -c1-300 || true

      - name: iPhone screenshots in the log (base64 JPEG)
        if: always()
        run: |
          mkdir -p phoneshots
          xcrun xcresulttool export attachments --path phone.xcresult --output-path phoneshots 2>&1 | tail -n 3 || true
          python3 -c '
          import json
          for t in json.load(open("phoneshots/manifest.json")):
              for a in t.get("attachments",[]):
                  n=a.get("suggestedHumanReadableName","")
                  if "phone" in n: print(a["exportedFileName"] + "\t" + n.split("_")[0])' > phonewanted.txt 2>/dev/null || true
          while IFS=$'\t' read -r F N; do
            [ -f "phoneshots/$F" ] || continue
            sips -Z 1400 -s format jpeg -s formatOptions 60 "phoneshots/$F" --out "$N.jpg" >/dev/null || continue
            echo "SHOT-BEGIN $N.jpg $(stat -f%z "$N.jpg")"
            base64 -i "$N.jpg" | fold -w 3000
            echo "SHOT-END"
          done < phonewanted.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-phone
          path: |
            phoneshots
            phone.log

      - name: Result
        if: always()
        run: exit $(cat status.txt 2>/dev/null || echo 1)
