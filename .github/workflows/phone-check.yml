name: Phone check (iPhone and iPad simulators)

# The every-feature-on-both-devices UI tests: UITests/*PhoneTests.swift on an iPhone simulator and UITests/*PadTests.swift on an
# iPad one (each class skips itself on the other device), with their screenshots ("phone-…", "pad-…") printed in the log as base64
# JPEGs for a reader that can't download artifacts. Run by hand, or on a push to a branch that touches those tests or this file.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["UITests/*PhoneTests.swift", "UITests/*PadTests.swift", ".github/workflows/phone-check.yml"]

concurrency:
  group: phone-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone:
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("${{ matrix.device }}")]
          c.sort(key=lambda x: (("Pro" not in x["name"]) or ("Max" in x["name"]), x["name"]))
          print(c[0]["udid"], c[0]["name"], file=sys.stderr)
          print(c[0]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          # the Calendar asks for access; grant it up front so the grid shows
          xcrun simctl privacy "$UDID" grant calendar app.nexus.mobile || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | grep -E "error:|BUILD|\*\*" | head -n 100

      - name: Run the tests
        # 55 since Nov 23: the iPhone's tests took 45 minutes once the Live Activity test (about 8 minutes) joined them
        timeout-minutes: 55
        run: |
          echo 1 > status.txt
          SUFFIX=$([ "${{ matrix.device }}" = iPad ] && echo PadTests || echo PhoneTests)
          ONLY=$(grep -ho "class [A-Za-z0-9_]*$SUFFIX" UITests/*.swift | awk '{print "-only-testing:NexusMobileUITests/" $2}' | sort -u | tr '\n' ' ')
          echo "running: $ONLY"
          set +e
          xcodebuild test-without-building -project NexusMobile.xcodeproj -scheme NexusMobileUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData $ONLY \
            -resultBundlePath phone.xcresult 2>&1 | tee phone.log | grep -E "UISTEP|Test Case|error|failed|passed|skipped"
          STATUS=${PIPESTATUS[0]}
          echo "xcodebuild test exited $STATUS"
          echo "$STATUS" > status.txt

      - name: Screenshots in the log (base64 JPEG)
        if: always()
        run: |
          mkdir -p phoneshots
          xcrun xcresulttool export attachments --path phone.xcresult --output-path phoneshots 2>&1 | tail -n 3 || true
          python3 -c '
          import json
          for t in json.load(open("phoneshots/manifest.json")):
              for a in t.get("attachments",[]):
                  n=a.get("suggestedHumanReadableName","")
                  if n.startswith("phone-") or n.startswith("pad-"): print(a["exportedFileName"] + "\t" + n.split("_")[0])' > phonewanted.txt 2>/dev/null || true
          while IFS=$'\t' read -r F N; do
            [ -f "phoneshots/$F" ] || continue
            sips -Z 1400 -s format jpeg -s formatOptions 60 "phoneshots/$F" --out "$N.jpg" >/dev/null || continue
            echo "SHOT-BEGIN $N.jpg $(stat -f%z "$N.jpg")"
            base64 -i "$N.jpg" | fold -w 3000
            echo "SHOT-END"
          done < phonewanted.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-check-${{ matrix.device }}
          path: |
            phoneshots
            phone.log

      # last, so a reader that sees only the log's end still sees which tests failed and why
      - name: Test summary
        if: always()
        run: |
          grep -E "UISTEP|Test Case .*(passed|failed|skipped)|error: -\[|XCTAssert|Executed [0-9]+ test" phone.log 2>/dev/null | cut -c1-400 | tail -n 100 || true
          exit $(cat status.txt 2>/dev/null || echo 1)
